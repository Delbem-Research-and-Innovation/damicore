[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hypothesis>=6,<7",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pandas-stubs>=2.2,<4",
    "pip-audit>=2.9,<3",
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<0.17",
    "twine>=7,<8",
]

[tool.uv.sources]
damicore-normalizer = { workspace = true }
damicore-distance = { workspace = true }
damicore-tree-builder = { workspace = true }
damicore-clusterizer = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
markers = [
    "unit: fast isolated unit tests",
    "contract: cross-package contract tests",
    "e2e: complete pipeline tests",
    "notebook: executable notebook tests",
    "slow: stress and benchmark-adjacent tests",
]

[tool.coverage.run]
branch = true
source = [
    "damicore",
    "damicore_normalizer",
    "damicore_distance",
    "damicore_tree_builder",
    "damicore_clusterizer",
    "synthetic_data",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
