version: 2

updates:
  # Specification section 25.3. Security advisories are delivered when they are published
  # rather than on this interval, so the schedule only paces routine version bumps.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The declared ranges are contract (specification sections 8.2 and 8.5); a routine bump
    # must move the resolved pins in uv.lock, not rewrite the range floors, or every group
    # update reopens a divergence between pyproject.toml and the specification.
    versioning-strategy: lockfile-only
    # One pull request for the routine floor-raising, so the queue stays readable, and a
    # separate one per major, where the whole point is to review the break on its own.
    groups:
      runtime-and-dev:
        patterns: ["*"]
        update-types: [minor, patch]

  # Nothing else updates the pinned action SHAs and tags, so without this they drift until
  # a deprecation breaks a lane.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Nothing else moves the pre-commit hook revisions, so without this they drift out of the
  # workspace's ruff range until the hook and `make check` disagree about the same file.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      hooks:
        patterns: ["*"]
