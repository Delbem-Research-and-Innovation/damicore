name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.6.1
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Reject pre-release interpreters
        # An outdated uv silently resolves a minor version to a release candidate when it
        # knows no final build. Runtime dependencies target final CPython releases, so that
        # substitution fails deep inside dependency internals instead of here.
        run: >
          uv run --no-project python -c
          "import sys; assert sys.version_info.releaselevel == 'final',
          f'pre-release interpreter rejected: {sys.version}'"
      - run: uv sync --locked --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov --cov-report=xml
      - name: Enforce critical-module coverage
        run: make coverage-critical

  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.6.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --all-packages --group dev
      - run: uv run pytest tests/architecture

  minimum-versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.6.1
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: false
      - run: uv lock --resolution lowest-direct
      - run: uv sync --all-packages --group dev
      - run: uv run pytest -m "not slow"

  notebook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.6.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --all-packages --group dev
      - name: Build wheels and install damicore into a clean environment
        run: |
          mkdir -p dist
          for package in damicore-normalizer damicore-distance damicore-tree-builder damicore-clusterizer damicore; do
            uv build --package "$package" --wheel --out-dir dist
          done
          uv venv /tmp/damicore-notebook-venv --python 3.12
          uv pip install --python /tmp/damicore-notebook-venv/bin/python --find-links dist damicore
      - name: Execute notebook against installed wheels
        env:
          DAMICORE_NOTEBOOK_PYTHON: /tmp/damicore-notebook-venv/bin/python
        run: uv run pytest tests/notebooks -m notebook
