name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede a pull request's own earlier runs; never discard a run that verified main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Specification section 25.1, jobs 1 to 3. Lint and types are interpreter-independent:
  # pyrightconfig.json pins pythonVersion, so running these once is the whole signal.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-workspace
      - run: make check

  # Specification section 25.1, jobs 4 and 6. `make test` runs the whole suite, so the
  # import-architecture tests are covered on every interpreter rather than once.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-workspace
        with:
          python-version: ${{ matrix.python }}
      - run: make test

  # Specification section 25.1, job 5. Resolves the floor of every declared range, so it
  # must not install from the committed lock.
  minimum-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-workspace
        with:
          python-version: "3.11"
          sync: none
      - run: uv lock --resolution lowest-direct
      - run: uv sync --all-packages --group dev
      - run: uv run pytest -m "not slow"

  # Specification sections 24.3 and 25.1, job 7. The notebook must execute cell by cell in
  # a kernel that only knows the built wheels, so a missing dependency or a broken public
  # symbol fails here rather than for a Colab user.
  notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WHEEL_VENV: /tmp/damicore-notebook-venv
      DAMICORE_NOTEBOOK_KERNEL: damicore-wheels
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-workspace
      - name: Install damicore from wheels and register its kernel
        run: |
          make wheels
          uv venv "$WHEEL_VENV" --python 3.12
          uv pip install --python "$WHEEL_VENV/bin/python" --find-links dist damicore ipykernel
          "$WHEEL_VENV/bin/python" -m ipykernel install --user \
            --name "$DAMICORE_NOTEBOOK_KERNEL" --display-name "$DAMICORE_NOTEBOOK_KERNEL"
      - run: uv run pytest tests/notebooks -m notebook
