name: Weekly dependency audit

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Specification section 25.3. Resolves the newest versions inside the declared ranges and
  # reports; it never commits an updated lock.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-workspace
        with:
          sync: none
      - run: uv lock --upgrade
      - run: uv sync --all-packages --group dev
      - run: make test
      - run: uv run pip-audit
      - name: Small benchmark
        run: >
          uv run python benchmarks/benchmark_large_csv.py
          --directory /tmp/damicore-benchmark --rows 100 --skip-large

      - name: Report the failure on the tracking issue
        if: failure()
        # One issue per failure mode, not one per week: a persistent failure comments on the
        # open report instead of opening a duplicate every Monday.
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Weekly dependency audit failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq 'first | .number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Audit failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "See workflow run $RUN_URL"
          fi
