name: Weekly dependency audit

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Specification section 25.3. Resolves the newest versions inside the declared ranges and
  # reports; it never commits an updated lock.
  audit:
    runs-on: ubuntu-24.04
    # Generous because the 2 GiB benchmark below writes and reads a multi-gigabyte working set
    # on top of the full suite and the audit.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-workspace
        with:
          sync: none
      - run: uv lock --upgrade
      - run: uv sync --all-packages --group dev
      - run: make test
      - run: uv run pip-audit
      # Both benchmarks required by specification section 24.4, as separate steps so a failure
      # names the one that regressed. They run against the upgraded resolution because a
      # dependency change is exactly what could regress either.
      - name: Benchmark the specified object counts
        run: >
          uv run python benchmarks/benchmark_large_csv.py
          --directory /tmp/damicore-benchmark --rows 100 --select sweep
          --output /tmp/damicore-measurements/sweep.json

      # Writes a 2 GiB CSV, normalizes it, and asserts the 1.5 GiB peak-RSS budget. Kept out of
      # every pull request lane: it is the one check that needs a multi-gigabyte working set.
      - name: Benchmark normalization of a 2 GiB CSV
        run: >
          uv run python benchmarks/benchmark_large_csv.py
          --directory /tmp/damicore-stress --select large
          --output /tmp/damicore-measurements/large.json

      # Specification section 24.4 alerts on a regression against the median of the last three
      # runs on the same runner, which requires the numbers to outlive the job that produced
      # them. Uploaded even on failure, because a run that broke the budget is exactly the one
      # worth reading; `warn` rather than `error` so a crash before the first write reports the
      # crash alone instead of adding a second, misleading failure.
      - name: Publish the benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: benchmark-measurements
          path: /tmp/damicore-measurements/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report the failure on the tracking issue
        if: failure()
        # One issue per failure mode, not one per week: a persistent failure comments on the
        # open report instead of opening a duplicate every Monday.
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Weekly dependency audit failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq 'first | .number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Audit failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "See workflow run $RUN_URL"
          fi
