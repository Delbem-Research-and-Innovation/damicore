name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

# Never cancel a release: a partially published version cannot be retracted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Specification section 24.4: the 2 GiB resource budget is proven at the tag commit, before
  # anything irreversible is published. The object sweep is left out because it asserts no
  # threshold, so it would cost minutes here without being able to fail.
  benchmark:
    uses: ./.github/workflows/benchmark.yml
    with:
      select: large

  release:
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-workspace

      - name: Resolve the tagged version and the publish allowlist
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "PUBLIC_PACKAGES=$(make -s print-public-packages)" >> "$GITHUB_ENV"

      # Specification section 25.4, step 2. The gate is the same one CI runs, by construction.
      - run: make check
      - run: make test

      # Specification section 25.4, step 1, checked against the artifacts that will be
      # published rather than against the sources they came from. verify-dist rejects a
      # version that any distribution disagrees on, so lockstep and tag agreement are one
      # assertion instead of a loop over the five pyproject files.
      - name: Build once and verify against the tag
        run: |
          make build
          sha256sum dist/* > SHA256SUMS
          uv run python .github/scripts/verify_dist.py \
            --dist dist --expect-version "$VERSION" -- $PUBLIC_PACKAGES

      - run: uv run twine check dist/*

      - name: Publish exact artifacts to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          attestations: false

      # The last gate before the irreversible publish, and the only one that exercises what
      # a user actually installs rather than a local build of it.
      - name: Smoke the TestPyPI publication
        env:
          SMOKE_VENV: /tmp/damicore-release-smoke
          DAMICORE_NOTEBOOK_KERNEL: damicore-release
        run: |
          uv venv "$SMOKE_VENV" --python 3.12
          uv pip install --python "$SMOKE_VENV/bin/python" \
            --index-url https://test.pypi.org/simple \
            --extra-index-url https://pypi.org/simple "damicore==$VERSION" ipykernel
          "$SMOKE_VENV/bin/damicore" --help
          "$SMOKE_VENV/bin/python" .github/scripts/wheel_smoke.py \
            --pipeline $(printf -- '--package %s ' $PUBLIC_PACKAGES)
          "$SMOKE_VENV/bin/python" -m ipykernel install --user \
            --name "$DAMICORE_NOTEBOOK_KERNEL" --display-name "$DAMICORE_NOTEBOOK_KERNEL"
          uv run pytest tests/notebooks -m notebook

      # The same artifacts built above; nothing is rebuilt between the two indexes.
      - name: Publish the same artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.13.0
        with:
          packages-dir: dist
          attestations: false

      - uses: softprops/action-gh-release@v2.3.2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
