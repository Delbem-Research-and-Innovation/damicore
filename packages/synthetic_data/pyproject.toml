[project]
name = "synthetic-data"
version = "0.1.0"
description = "Internal-only synthetic dataset generator for exercising the DAMICORE packages in tests. Not published, not a runtime dependency of any damicore-* package."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ennio Politi Lopes", email = "enniolopes@users.noreply.github.com" }]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "RUF100", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: fast isolated unit tests"]
# --cov-branch and the floor mirror the root configuration on purpose: coverage resolves
# its config from the working directory, so a package-scoped run would otherwise report
# line coverage with no threshold and read as a stronger result than it is.
addopts = "--cov=synthetic_data --cov-branch --cov-report=term-missing --cov-fail-under=90"
