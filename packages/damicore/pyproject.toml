[project]
name = "damicore"
version = "0.1.0"
description = "Pipeline orchestrator that sequences the damicore_* packages (normalizer, distance, tree_builder, clusterizer)."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ennio Politi Lopes", email = "enniolopes@users.noreply.github.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "damicore-normalizer",
    "damicore-distance",
    "damicore-tree-builder",
    "damicore-clusterizer",
]

# Resolved from the sibling packages/* directories via the uv workspace
# (root pyproject.toml). Once each sub-package is published to PyPI, this
# table can be dropped so `damicore` depends on the published versions
# declared above instead of the workspace members.
[tool.uv.sources]
damicore-normalizer = { workspace = true }
damicore-distance = { workspace = true }
damicore-tree-builder = { workspace = true }
damicore-clusterizer = { workspace = true }

[tool.uv]
package = true

[dependency-groups]
dev = ["ruff>=0.9", "pyright>=1.1", "pytest>=8", "pytest-cov>=6"]

[tool.ruff]
line-length = 100
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: fast isolated unit tests"]
