[project]
name = "damicore-normalizer"
version = "0.1.0"
description = "Dataset normalization stage for the DAMICORE pipeline."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ennio Politi Lopes", email = "enniolopes@users.noreply.github.com" }]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: fast isolated unit tests"]
addopts = "--cov=damicore_normalizer --cov-report=term-missing"
