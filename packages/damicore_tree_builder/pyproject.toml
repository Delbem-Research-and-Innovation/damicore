[project]
name = "damicore-tree-builder"
version = "0.1.0"
description = "Neighbor-Joining tree builder for the DAMICORE pipeline."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ennio Politi Lopes", email = "enniolopes@users.noreply.github.com" }]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
keywords = ["damicore", "neighbor-joining", "phylogenetics", "tree", "newick"]
dependencies = ["numpy>=1.26,<3", "pydantic>=2.10,<3"]

[tool.uv]
package = true

[project.urls]
Homepage = "https://github.com/Delbem-Research-and-Innovation/damicore"
Repository = "https://github.com/Delbem-Research-and-Innovation/damicore"
Issues = "https://github.com/Delbem-Research-and-Innovation/damicore/issues"
Changelog = "https://github.com/Delbem-Research-and-Innovation/damicore/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "RUF100", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: fast isolated unit tests"]
# --cov-branch and the floor mirror the root configuration on purpose: coverage resolves
# its config from the working directory, so a package-scoped run would otherwise report
# line coverage with no threshold and read as a stronger result than it is.
addopts = "--cov=damicore_tree_builder --cov-branch --cov-report=term-missing --cov-fail-under=90"
