[project]
name = "damicore-tree-builder"
version = "0.1.0"
description = "Neighbor-Joining tree builder for the DAMICORE pipeline."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ennio Politi Lopes", email = "enniolopes@users.noreply.github.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = ["typer>=0.26.7"]

[project.scripts]
damicore-tree-builder = "damicore_tree_builder.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = ["ruff>=0.9", "pyright>=1.1", "pytest>=8", "pytest-cov>=6"]

[tool.ruff]
line-length = 100
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: fast isolated unit tests"]
addopts = "--cov=damicore_tree_builder --cov-report=term-missing"
